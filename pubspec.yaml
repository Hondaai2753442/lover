name: arabic_couples_game
description: لعبة عربية للأزواج مع وضع خمن الشخصية بملامح عربية.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.18.3
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/couples_cards.json
    - assets/characters.json
